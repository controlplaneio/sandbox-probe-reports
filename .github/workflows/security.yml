name: "Security Scanning"
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Inlined rather than `uses: chrisns/.github/...@main`: an organisation repository
# should not depend on a personal one, and controlplaneio/.github publishes no
# reusable workflows to point at instead.
jobs:
  CodeQL:
    name: CodeQL
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.30.0
        continue-on-error: true
        id: initcodeql
      - name: Autobuild
        if: steps.initcodeql.outcome == 'success'
        uses: github/codeql-action/autobuild@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.30.0
      - name: Perform CodeQL Analysis
        if: steps.initcodeql.outcome == 'success'
        uses: github/codeql-action/analyze@4e828ff8d448a8a6e532957b1811f387a63867e8 # v3.30.0
